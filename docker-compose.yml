version: '3.8'

services:
  web:
    image: node:20-alpine
    restart: always
    working_dir: /app
    # Montamos el código local adentro del contenedor para que haya Hot-Reload
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      # Apunta al contenedor de la base de datos local
      - DATABASE_URL=mysql://root:root@db:3306/petqrdb
    # Ejecuta el servidor de desarrollo
    command: sh -c "npm install && npm run dev"
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: petqrdb
    ports:
      - "3307:3306"
    volumes:
      - petqr_mysql_data:/var/lib/mysql

volumes:
  petqr_mysql_data:
