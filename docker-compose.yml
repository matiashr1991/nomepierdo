version: '3.8'

services:
  web:
    image: node:20-alpine
    restart: always
    working_dir: /app
    # Montamos el código local adentro del contenedor para que haya Hot-Reload
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      # Apunta al contenedor de la base de datos local
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/petqrdb?schema=public
    # Ejecuta el servidor de desarrollo
    command: sh -c "npm install && npm run dev"
    depends_on:
      - db

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: petqrdb
    ports:
      - "5433:5432"
    volumes:
      - petqr_postgres_data:/var/lib/postgresql/data

volumes:
  petqr_postgres_data:
